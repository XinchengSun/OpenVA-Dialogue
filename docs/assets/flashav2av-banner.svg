    <path d="M208 14c49 0 88 39 88 88s-39 88-88 88c-22 0-43-8-58-22" opacity="0.72"/>
    <path d="M217 56c28 0 51 22 51 50 0 20-12 37-29 45" opacity="0.9"/>
    <circle cx="219" cy="91" r="5" fill="#42d7ff" stroke="none"/>
    <path d="M208 121c13 8 25 8 38 0"/>
