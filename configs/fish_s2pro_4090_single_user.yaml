config_cls: S2ProPipelineConfig
model_path: fishaudio/s2-pro

# RTX 4090 (24 GiB), single interactive conversation.
# The upstream defaults reserve 85% of the card and build CUDA graphs through
# batch size 64.  That leaves no room for the colocated Fish vocoder on 24 GiB.
runtime_overrides:
  tts_engine:
    server_args_overrides:
      mem_fraction_static: 0.60
      max_running_requests: 1
      max_total_tokens: 8192
      disable_cuda_graph: false
      cuda_graph_bs: [1]
      cuda_graph_max_bs: 1
  vocoder:
    max_batch_size: 1
    max_batch_wait_ms: 0
