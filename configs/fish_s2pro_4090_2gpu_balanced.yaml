config_cls: S2ProPipelineConfig
model_path: fishaudio/s2-pro

# Two-GPU stage split for a single interactive request:
# logical GPU 0 runs Slow-AR + Fast-AR; logical GPU 1 runs codec/vocoder.
stages:
  - name: preprocessing
    process: preprocessing
    factory: sglang_omni.models.fishaudio_s2_pro.stages.create_preprocessing_executor
    next: tts_engine
  - name: tts_engine
    process: tts_engine
    factory: sglang_omni.models.fishaudio_s2_pro.stages.create_sglang_tts_engine_executor
    factory_args:
      device: cuda:0
      max_new_tokens: 2048
    gpu: 0
    next: vocoder
    stream_to: [vocoder]
  - name: vocoder
    process: vocoder
    factory: sglang_omni.models.fishaudio_s2_pro.stages.create_vocoder_executor
    gpu: 1
    terminal: true
    can_accept_stream_before_payload: true

runtime_overrides:
  tts_engine:
    server_args_overrides:
      mem_fraction_static: 0.60
      max_running_requests: 1
      max_total_tokens: 8192
      disable_cuda_graph: false
      cuda_graph_bs: [1]
      cuda_graph_max_bs: 1
  vocoder:
    stream_stride: 20
    stream_followup_stride: 10
    stream_overlap_tokens: 20
    stream_crossfade_samples: 512
    max_batch_size: 1
    max_batch_wait_ms: 0
