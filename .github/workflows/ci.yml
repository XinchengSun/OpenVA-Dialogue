name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python sources
        run: python -m compileall -q .
      - name: Validate shell launchers
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find . -type f \( -name '*.sh' -o -path './scripts/flashav2av' \) -print0)
      - name: Validate weight manifest and downloader
        run: python -m unittest tests.test_weights_manifest -v
      - name: Validate primary Fish configuration
        run: python -m unittest tests.test_configure_custom_runtime tests.test_s2s_launcher_contract -v
      - name: Validate single-GPU algebra, preprocessing, and measurements
        run: python -m unittest tests.test_cfg_pruning tests.test_single_gpu_face_detector tests.test_benchmark_single_gpu -v
      - name: Validate single-GPU launch and bridge ownership
        timeout-minutes: 5
        run: |
          bash tests/test_single_gpu_launchers.sh
          bash tests/test_single_gpu_bridge_reuse.sh
          bash tests/test_single_gpu_setup.sh
      - name: Install customization test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          python -m pip install 'aiohttp==3.13.2' 'Pillow==12.0.0'
      - name: Validate Fish portrait and voice customization
        run: python -m unittest tests.test_customization_runtime -v
      - name: Validate Fish lifecycle ownership
        run: bash tests/test_fish_s2pro_lifecycle.sh
      - name: Validate release CLI
        run: bash scripts/flashav2av help
      - name: Reject committed model weights and credentials
        shell: bash
        run: |
          if git ls-files -z '*.ckpt' '*.pth' '*.pt' '*.safetensors' '*.bin' '*.onnx' '*.engine' | grep -qz .; then
            echo 'Model weight file is tracked by Git.' >&2
            exit 1
          fi
          if git ls-files -z '*.pem' '*.key' '*.p12' '*.pfx' 'id_rsa*' 'id_ed25519*' | grep -qz .; then
            echo 'Credential file is tracked by Git.' >&2
            exit 1
          fi
          oversized="$(find . -path ./.git -prune -o -type f -size +99M -print)"
          if [[ -n "$oversized" ]]; then
            echo "Tracked release surface contains files near GitHub's 100 MB limit:" >&2
            echo "$oversized" >&2
            exit 1
          fi
  cpu-inference-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only inference test dependencies
        run: |
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'torch_ema==0.3'
      - name: Validate EMA folding and bounded audio history
        run: python -m unittest tests.test_inference_ema tests.test_motion_audio_history -v
